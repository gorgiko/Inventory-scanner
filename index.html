<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Native Barcode Scanner - Попис ОС</title>

<style>

body {
    font-family: Arial, sans-serif;
    margin:20px;
}

#camera {
    width:100%;
    max-width:450px;
    border:3px solid #ccc;
}

#camera.success {
    border-color:green;
}

input,button {
    width:100%;
    padding:12px;
    margin:8px 0;
    font-size:16px;
}

label {
    display:flex;
    gap:10px;
    margin:10px 0;
}

#message {
    font-weight:bold;
    margin:10px 0;
}

</style>

</head>

<body>


<h2>Баркод скенер за попис на ОС</h2>


<video id="camera" autoplay playsinline></video>


<div id="message"></div>


<input id="barcode"
       placeholder="Инвентарен број"
       readonly>


<label>
<input type="checkbox" id="podrum">
Подрум
</label>


<label>
<input type="checkbox" id="sistemsala">
Систем сала
</label>


<button onclick="toggleTorch()">
Фенер
</button>


<button onclick="saveItem()">
Зачувај
</button>



<script>


const video = document.getElementById("camera");
const barcodeInput = document.getElementById("barcode");
const message = document.getElementById("message");


let stream;
let track;
let scanning=true;

let lastCode="";

let torch=false;


// ----------------------
// SOUND
// ----------------------

let audioContext;


function beep(){

    if(!audioContext)
        audioContext=new AudioContext();


    let osc=audioContext.createOscillator();
    let gain=audioContext.createGain();


    osc.frequency.value=1200;
    osc.type="square";

    gain.gain.value=0.2;


    osc.connect(gain);
    gain.connect(audioContext.destination);


    osc.start();


    setTimeout(()=>{
        osc.stop();
    },100);

}



// ----------------------
// CAMERA START
// ----------------------

async function startCamera(){


try{


stream = await navigator.mediaDevices.getUserMedia({

video:{
    facingMode:{
        ideal:"environment"
    },

    width:{
        ideal:1920
    },

    height:{
        ideal:1080
    },

    focusMode:"continuous"
},

audio:false

});


video.srcObject=stream;


track=stream.getVideoTracks()[0];


startScanner();


}

catch(e){

message.innerHTML=
"კამერის შეცდომა: "+e.message;

}


}




// ----------------------
// BARCODE DETECTOR
// ----------------------

async function startScanner(){


if(!("BarcodeDetector" in window)){


message.innerHTML=
"Овој browser нема Native BarcodeDetector API";


return;

}



const detector =
new BarcodeDetector({

formats:[

"code_128",
"code_39",
"code_93",
"ean_13",
"ean_8",
"itf",
"qr_code",
"data_matrix"

]

});



async function scan(){


if(!scanning)
return;



try{


const codes =
await detector.detect(video);



if(codes.length>0){


let value =
codes[0].rawValue;



if(value !== lastCode){


lastCode=value;


barcodeInput.value=value;


message.innerHTML=
"Скениран: "+value;


video.classList.add("success");


setTimeout(()=>{

video.classList.remove("success");

},300);



beep();


}


}



}

catch(e){

console.log(e);

}



requestAnimationFrame(scan);


}



scan();


}




// ----------------------
// TORCH
// ----------------------

async function toggleTorch(){


if(!track)
return;


let capabilities =
track.getCapabilities();



if(!capabilities.torch){

alert("Овој телефон нема поддршка за фенер преку камера.");

return;

}



torch=!torch;


await track.applyConstraints({

advanced:[
{
torch:torch
}
]

});


}




// ----------------------
// SAVE INVENTORY
// ----------------------

function saveItem(){


let item={

barcode:
barcodeInput.value,


podrum:
document.getElementById("podrum").checked,


sistemsala:
document.getElementById("sistemsala").checked,


time:
new Date().toISOString()

};



localStorage.setItem(
"last_inventory",
JSON.stringify(item)
);



alert("Запишано!");

}




startCamera();


</script>


</body>
</html>
