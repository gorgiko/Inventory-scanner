<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Баркод скенер за попис на ОС</title>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }

 #scanner{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background:#000;
    z-index:9999;
}
  #scanner.success {
    border-color: green;
  }

  #message {
    font-weight: bold;
    margin-bottom: 10px;
  }

  input:not([type="checkbox"]), select, textarea, button {
    display: block;
    margin: 10px 0;
    width: 100%;
    padding: 8px;
    font-size: 16px;
  }

  input[type="checkbox"] {
    width: auto;
    transform: scale(1.2);
  }

  label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 10px 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }

  th, td {
    border: 1px solid #ccc;
    padding: 8px;
  }
</style>
</head>
<body>

<h2>Баркод скенер за попис на ОС</h2>

<div id="scanner"></div>
<div id="message"></div>

<form id="inventoryForm">
  <input type="text" id="barcode" placeholder="Инвентарен број" readonly>

  <!-- Podrum -->
  <label>
    <input type="checkbox" id="podrum">
    Подрум
  </label>

  <!-- Sistem sala -->
  <label>
    <input type="checkbox" id="sistemsala">
    Систем сала
  </label>

  <input type="text" id="location" placeholder="Внесете број на канцеларија" required>

  <select id="condition" required>
    <option value="">Изберете состојба</option>
    <option value="Се користи">Се користи</option>
    <option value="За расход">За расход</option>
    <option value="За донација">За донација</option>
  </select>

  <textarea id="description" placeholder="Опис/Забелешка"></textarea>

  <button type="submit">Зачувај</button>
</form>

<h3>Зачувани податоци</h3>
<table id="inventoryTable">
  <thead>
    <tr>
      <th>Инв.број</th>
      <th>Канцеларија</th>
      <th>Состојба</th>
      <th>Опис</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
const scannerDiv = document.getElementById("scanner");
const barcodeInput = document.getElementById("barcode");
const tableBody = document.querySelector("#inventoryTable tbody");
const messageDiv = document.getElementById("message");

const locationInput = document.getElementById("location");
const podrumCheckbox = document.getElementById("podrum");
const sistemSalaCheckbox = document.getElementById("sistemsala");

let inventory = [];
let lastScanned = null;

/* =========================
   CHECKBOX LOGIC
========================= */
function updateLocationFromCheckboxes() {
  if (podrumCheckbox.checked) {
    locationInput.value = "Подрум";
    locationInput.disabled = true;
    locationInput.removeAttribute("required");
    sistemSalaCheckbox.checked = false;
  } 
  else if (sistemSalaCheckbox.checked) {
    locationInput.value = "Систем сала";
    locationInput.disabled = true;
    locationInput.removeAttribute("required");
    podrumCheckbox.checked = false;
  } 
  else {
    locationInput.value = "";
    locationInput.disabled = false;
    locationInput.setAttribute("required", true);
  }
}

podrumCheckbox.addEventListener("change", updateLocationFromCheckboxes);
sistemSalaCheckbox.addEventListener("change", updateLocationFromCheckboxes);

/* =========================
   AUDIO (INDUSTRIAL BEEP)
========================= */
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

["click", "touchstart", "keydown"].forEach(event => {
  document.addEventListener(event, initAudio, { once: true });
});

function playBeep() {
  if (!audioCtx) return;

  const now = audioCtx.currentTime;

  function beep(startTime) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "square"; // aggressive scanner sound
    osc.frequency.setValueAtTime(1800, startTime); // high pitch

    // envelope (attack + decay)
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(0.6, startTime + 0.005); // loud
    gain.gain.linearRampToValueAtTime(0, startTime + 0.08);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(startTime);
    osc.stop(startTime + 0.08);
  }

  // 🔥 DOUBLE BEEP (industrial style)
  beep(now);
  beep(now + 0.12);
}
/* =========================
   MESSAGE
========================= */
function showMessage(msg, isError=false) {
  messageDiv.style.color = isError ? "red" : "green";
  messageDiv.textContent = msg;
  setTimeout(() => messageDiv.textContent = "", 2000);
}

/* =========================
   TABLE
========================= */
function renderTable() {
  tableBody.innerHTML = "";
  inventory.forEach(entry => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${entry.barcode}</td>
      <td>${entry.location}</td>
      <td>${entry.condition}</td>
      <td>${entry.description}</td>
    `;
    tableBody.appendChild(tr);
  });
}

/* =========================
   SCANNER
========================= */
/* =========================
   SCANNER
========================= */

const html5QrCode = new Html5Qrcode("scanner");

const config = {
  fps: 15,
  aspectRatio: 1.7778,
  disableFlip: true,

  // Scan the entire camera preview
  qrbox: undefined,

  rememberLastUsedCamera: true,

  experimentalFeatures: {
    useBarCodeDetectorIfSupported: true
  },

  formatsToSupport: [
    Html5QrcodeSupportedFormats.QR_CODE,
    Html5QrcodeSupportedFormats.DATA_MATRIX,
    Html5QrcodeSupportedFormats.PDF_417,
    Html5QrcodeSupportedFormats.AZTEC,

    // Add 1D barcodes
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.CODE_93,
    Html5QrcodeSupportedFormats.CODABAR,
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.ITF,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E
  ]
};

function onScanSuccess(decodedText) {

    if (decodedText === lastScanned) return;

    lastScanned = decodedText;

    initAudio();
    playBeep();

    barcodeInput.value = decodedText;

    scannerDiv.classList.add("success");

    setTimeout(() => {
        scannerDiv.classList.remove("success");
    }, 200);

}


async function startScanner() {

    try {

        const cameras = await Html5Qrcode.getCameras();

        if (cameras && cameras.length) {

            // Try to find the rear camera
            const rearCamera =
                cameras.find(c =>
                    c.label.toLowerCase().includes("back") ||
                    c.label.toLowerCase().includes("rear") ||
                    c.label.toLowerCase().includes("environment")
                ) || cameras[cameras.length - 1];

            await html5QrCode.start(
                rearCamera.id,
                config,
                onScanSuccess
            );

        } else {

            await html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess
            );

        }

    } catch (e) {

        console.log("Rear camera failed:", e);

        try {

            await html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess
            );

        } catch {

            await html5QrCode.start(
                { facingMode: "user" },
                config,
                onScanSuccess
            );

        }

    }

}

startScanner();


/* =========================
   SUBMIT
========================= */
document.getElementById("inventoryForm").addEventListener("submit", e => {
  e.preventDefault();

  const entry = {
    barcode: barcodeInput.value,
    location: locationInput.value,
    condition: document.getElementById("condition").value,
    description: document.getElementById("description").value
  };

  if (!entry.barcode) {
    showMessage("Скенирај баркод!", true);
    return;
  }

  const webAppUrl = "https://script.google.com/macros/s/AKfycbxb1pxZxUrmITmtLZF6wIaCQaJ9pFYA2AqbP0HMBgAA5zp2RO-fC0Ik0aSk4R_0J7JeMQ/exec";

  fetch(webAppUrl, {
    method: "POST",
    body: JSON.stringify(entry)
  })
  .then(res => res.text())
  .then(text => {
    let response;
    try { response = JSON.parse(text); }
    catch { response = { status:"error", message:text }; }

    if (response.status === "success") {
      inventory.push(entry);
      renderTable();

      document.getElementById("inventoryForm").reset();

      locationInput.disabled = false;
      locationInput.setAttribute("required", true);

      barcodeInput.value = "";
      lastScanned = null;

      showMessage("Зачувано!");
    } else {
      showMessage("Error: " + response.message, true);
    }
  })
  .catch(() => {
    showMessage("Грешка при зачувување!", true);
  });
});
</script>
 <footer style="margin-top:40px; text-align:center; font-size:14px; color:#666;">

</footer>
</body>
</html>
